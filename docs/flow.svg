<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="搜索流程">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161E33"/>
      <stop offset="100%" stop-color="#101728"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.85"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
  </defs>

  <rect width="960" height="220" rx="18" fill="#0B1020"/>
  <text x="28" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#94A3B8">搜索流程</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <g>
      <rect x="12" y="62" width="204" height="112" rx="14" fill="url(#card)" stroke="#F97316" stroke-opacity="0.28"/>
      <circle cx="46" cy="96" r="15" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.5"/>
      <text x="46" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#FDBA74">1</text>
      <text x="72" y="102" font-size="17" font-weight="600" fill="#F1F5F9">发送图片</text>
      <text x="34" y="134" font-size="13" fill="#94A3B8">附带图片的指令</text>
      <text x="34" y="156" font-size="13" fill="#94A3B8">或回复目标图片</text>
    </g>

    <path d="M 224 118 L 252 118" stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="256" y="62" width="204" height="112" rx="14" fill="url(#card)" stroke="#F97316" stroke-opacity="0.28"/>
      <circle cx="290" cy="96" r="15" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.5"/>
      <text x="290" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#FDBA74">2</text>
      <text x="316" y="102" font-size="17" font-weight="600" fill="#F1F5F9">提取图片</text>
      <text x="278" y="134" font-size="13" fill="#94A3B8">当前消息 · 引用消息</text>
      <text x="278" y="156" font-size="13" fill="#94A3B8">10 分钟图片缓存</text>
    </g>

    <path d="M 468 118 L 496 118" stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="500" y="62" width="204" height="112" rx="14" fill="url(#card)" stroke="#F97316" stroke-opacity="0.28"/>
      <circle cx="534" cy="96" r="15" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.5"/>
      <text x="534" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#FDBA74">3</text>
      <text x="560" y="102" font-size="17" font-weight="600" fill="#F1F5F9">soutubot 检索</text>
      <text x="522" y="134" font-size="13" fill="#94A3B8">首页鉴权参数 + 上传</text>
      <text x="522" y="156" font-size="13" fill="#94A3B8">按相似度降序返回</text>
    </g>

    <path d="M 712 118 L 740 118" stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="744" y="62" width="204" height="112" rx="14" fill="url(#card)" stroke="#F97316" stroke-opacity="0.55"/>
      <circle cx="778" cy="96" r="15" fill="#F97316" fill-opacity="0.28" stroke="#F97316" stroke-opacity="0.7"/>
      <text x="778" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#FDBA74">4</text>
      <text x="804" y="102" font-size="17" font-weight="600" fill="#F1F5F9">合并转发</text>
      <text x="766" y="134" font-size="13" fill="#94A3B8">封面 · 相似度 · 链接</text>
      <text x="766" y="156" font-size="13" fill="#94A3B8">引用后可继续下载</text>
    </g>
  </g>
</svg>

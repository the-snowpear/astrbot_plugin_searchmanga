<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="OneBot 文件传输链路">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161E33"/>
      <stop offset="100%" stop-color="#101728"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F97316"/>
    </marker>
  </defs>

  <rect width="960" height="380" rx="18" fill="url(#bg2)"/>
  <text x="28" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#94A3B8">OneBot 文件传输：三级自适应降级</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <g>
      <rect x="24" y="56" width="912" height="80" rx="14" fill="url(#card2)" stroke="#F97316" stroke-opacity="0.5"/>
      <rect x="40" y="72" width="48" height="48" rx="12" fill="#F97316" fill-opacity="0.16" stroke="#F97316" stroke-opacity="0.55"/>
      <text x="64" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#FDBA74">1</text>
      <text x="106" y="88" font-size="17" font-weight="600" fill="#F1F5F9">base64:// 内存直传</text>
      <text x="106" y="114" font-size="13" fill="#94A3B8">文件大小不超过 base64_file_limit_mb（默认 48 MB），无需任何网络回调</text>
      <text x="900" y="100" text-anchor="end" font-size="13" fill="#34D399">最快</text>
    </g>

    <path d="M 480 140 L 480 168" stroke="#F97316" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="496" y="162" font-size="12" fill="#64748B">超过阈值 / 直传失败</text>

    <g>
      <rect x="24" y="172" width="912" height="80" rx="14" fill="url(#card2)" stroke="#F97316" stroke-opacity="0.32"/>
      <rect x="40" y="188" width="48" height="48" rx="12" fill="#F97316" fill-opacity="0.16" stroke="#F97316" stroke-opacity="0.45"/>
      <text x="64" y="220" text-anchor="middle" font-size="20" font-weight="700" fill="#FDBA74">2</text>
      <text x="106" y="204" font-size="17" font-weight="600" fill="#F1F5F9">upload_file_stream 流式分片</text>
      <text x="106" y="230" font-size="13" fill="#94A3B8">按 stream_chunk_kb 切片上传至协议端，适配 AstrBot 与 NapCat 跨机 / 跨容器部署</text>
      <text x="900" y="216" text-anchor="end" font-size="13" fill="#FBBF24">跨主机</text>
    </g>

    <path d="M 480 256 L 480 284" stroke="#F97316" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="496" y="278" font-size="12" fill="#64748B">协议端不支持 / 上传失败</text>

    <g>
      <rect x="24" y="288" width="912" height="72" rx="14" fill="url(#card2)" stroke="#F97316" stroke-opacity="0.24"/>
      <rect x="40" y="300" width="48" height="48" rx="12" fill="#F97316" fill-opacity="0.16" stroke="#F97316" stroke-opacity="0.4"/>
      <text x="64" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#FDBA74">3</text>
      <text x="106" y="316" font-size="17" font-weight="600" fill="#F1F5F9">HTTP Token 回调下载</text>
      <text x="106" y="342" font-size="13" fill="#94A3B8">file_token_service 提供 1 小时时效链接，下载前校验 ZIP Magic（PK）防止坏包</text>
      <text x="900" y="328" text-anchor="end" font-size="13" fill="#94A3B8">兜底</text>
    </g>
  </g>
</svg>
